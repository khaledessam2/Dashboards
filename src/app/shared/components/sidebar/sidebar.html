<div class="flex min-h-0 flex-1 flex-col overflow-hidden bg-side max-[900px]:flex-row max-[900px]:items-center">
  <div class="mx-6 flex shrink-0 items-center gap-3 py-6 max-[900px]:m-0 max-[900px]:px-3 max-[900px]:py-2">
    <div class="flex min-w-0 flex-col max-[900px]:hidden">
      <b class="truncate text-[20px] leading-[1.4] font-bold text-white">مركز القيادة والتحكم</b>
      <span class="truncate text-[16px] font-bold text-[#8a99af]">المدينة المنورة</span>
    </div>
  </div>
  <p class="mx-6 mt-2 mb-3 text-sm font-semibold text-[#8a99af] max-[900px]:hidden">القائمة</p>
  <nav
    class="flex flex-col gap-1 overflow-y-auto px-4 [scrollbar-width:thin] max-[900px]:min-w-0 max-[900px]:flex-1 max-[900px]:flex-row max-[900px]:overflow-x-auto max-[900px]:overflow-y-hidden max-[900px]:py-2 max-[900px]:[scrollbar-width:none]">
    @for (dashboard of dashboards; track dashboard.ar) {
      @if (dashboard.path) {
        <a [routerLink]="dashboard.path" routerLinkActive="active"
          class="group flex h-11 items-center gap-3 rounded-sm px-3 text-[15px] font-medium text-[#dee4ee] no-underline transition-colors duration-150 select-none focus-visible:-outline-offset-2 focus-visible:outline-white [&:not(.active):hover]:bg-white/5 [&.active]:bg-white/10 [&.active]:text-white max-[900px]:flex-none max-[900px]:whitespace-nowrap">
          <span class="material-symbols-outlined shrink-0 !text-[22px]">{{ dashboard.icon }}</span>
          <span class="text-xl">{{ dashboard.ar }}</span>
        </a>
      } @else {
        <span class="flex h-11 items-center gap-3 rounded-sm px-3 text-[15px] font-medium text-[#dee4ee]/60 select-none max-[900px]:flex-none max-[900px]:whitespace-nowrap">
          <span class="material-symbols-outlined shrink-0 !text-[22px]">{{ dashboard.icon }}</span>
          <span class="text-xl">{{ dashboard.ar }}</span>
        </span>
      }
    }
  </nav>
</div>
