<header class="flex flex-col gap-0.5">
  <h2 class="m-0 flex items-center gap-2 text-[20px] leading-6 font-bold text-ink">
    @if (icon()) {
      <span class="material-symbols-outlined text-brand !text-[24px]">{{ icon() }}</span>
    }
    {{ title() }}
  </h2>
  @if (hint()) {
    <span class="text-[14px] leading-5 text-ink-2">{{ hint() }}</span>
  }
</header>
<ng-content />
