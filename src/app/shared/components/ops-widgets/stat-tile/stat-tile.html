<div class="flex items-center gap-2 text-[15px] font-medium text-ink-2">
  <span class="material-symbols-outlined !text-[20px]" [style.color]="iconColor()">{{ icon() }}</span>
  {{ label() }}
</div>
<div class="flex flex-wrap items-center justify-between gap-x-2 gap-y-1">
  <div class="flex min-w-0 items-baseline gap-1.5">
    <span class="num text-[34px] leading-10 font-bold" [style.color]="valueColor()">{{ value() }}</span>
    @if (unit()) {
      <span class="text-[15px] font-medium text-ink-2">{{ unit() }}</span>
    }
  </div>
  @if (ring() !== null) {
    <span class="relative size-11 shrink-0 rounded-full" [style.background]="ringBg()">
      <span class="absolute inset-[5px] rounded-full bg-surface"></span>
    </span>
  } @else if (chip()) {
    <span class="num rounded-full px-2.5 py-0.5 text-[13px] font-bold whitespace-nowrap" [style.background]="chipStyle().bg" [style.color]="chipStyle().fg">{{ chip() }}</span>
  }
</div>
@if (sub()) {
  <span class="text-[13px] leading-4 text-ink-3">{{ sub() }}</span>
}
@if (bar() !== null) {
  <div class="h-1.5 overflow-hidden rounded-full bg-track"><div class="h-full rounded-full" [style.width.%]="bar()" [style.background]="iconColor()"></div></div>
}
