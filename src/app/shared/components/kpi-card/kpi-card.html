<div class="flex h-full items-center justify-between gap-4">
  @if (def().parts; as parts) {
    <div class="flex min-w-0 items-start gap-8 max-[900px]:gap-5 max-[480px]:gap-3">
      @for (p of parts; track p.label) {
        <div class="flex min-w-0 flex-col items-start gap-1">
          <span class="num flex h-9 items-center text-xl leading-none font-bold whitespace-nowrap text-ink max-[900px]:text-lg">{{ p.value }}</span>
          <span class="truncate text-base whitespace-nowrap leading-5 font-medium text-ink-2">{{ p.label }}</span>
        </div>
      }
    </div>
  } @else {
  <div class="flex min-w-0 flex-col gap-1">
    <span
      class="num text-2xl leading-8 font-bold max-[900px]:text-xl"
      [class.text-ink]="!def().status"
      [class.text-yellow-500]="def().status === 'warn'"
      [class.text-red-600]="def().status === 'crit'"
      >{{ def().value }}</span
    >
    <span class="truncate text-lg leading-6 font-medium text-ink-2" [attr.title]="def().ar">{{ def().ar }}</span>
  </div>
  }
  <span
    class="flex size-14 shrink-0 items-center justify-center rounded-full"
    [class.bg-brand/10]="!def().status"
    [class.bg-yellow-500/15]="def().status === 'warn'"
    [class.bg-red-600/10]="def().status === 'crit'"
  >
    <span
      class="material-symbols-outlined block size-7 text-center !text-[28px] !leading-7"
      [class.text-brand]="!def().status"
      [class.text-yellow-500]="def().status === 'warn'"
      [class.text-red-600]="def().status === 'crit'"
      >{{ def().icon }}</span
    >
  </span>
</div>
