<div class="flex items-center justify-between gap-4 max-[480px]:gap-3">
  <div class="flex min-w-0 gap-3 flex-col">
    <span class="text-lg leading-[22px] font-normal text-ink-2">
      {{ def().ar }}
    </span>
    <span class="num text-[30px] leading-10 font-bold text-ink max-[900px]:text-2xl max-[900px]:leading-8">
      {{ def().value }}
    </span>
  </div>
  <span class="material-symbols-outlined grid size-14 place-items-center rounded-md text-[36px] text-brand max-[900px]:size-11 max-[900px]:text-[30px]">
    {{ def().icon }}
  </span>
</div>
