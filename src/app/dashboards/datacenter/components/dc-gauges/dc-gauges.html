@for (g of gauges(); track g.id) {
  <div class="card items-center justify-center gap-3" [id]="g.id">
    <div class="relative size-36 max-[480px]:size-32">
      <svg viewBox="0 0 100 100" class="size-full -rotate-90" aria-hidden="true">
        <circle cx="50" cy="50" r="42" fill="none" stroke="var(--track)" stroke-width="9" />
        <circle
          cx="50" cy="50" r="42" fill="none" stroke-width="9" stroke-linecap="round" pathLength="100"
          class="transition-all duration-700"
          [attr.stroke]="g.color"
          [attr.stroke-dasharray]="g.pct + ' 100'"
        />
      </svg>
      @let parts = g.valueText.split(' ');
      <span class="num absolute inset-0 flex flex-col items-center justify-center leading-tight font-bold text-ink [direction:ltr]" [id]="g.id + '-val'">
        <span class="text-[22px]">{{ parts[0] }}</span>
        @if (parts[1]) {
          <span class="text-[13px] font-semibold text-ink-2">{{ parts[1] }}</span>
        }
      </span>
    </div>
    <span class="flex items-center gap-2 text-lg font-bold text-ink-2">
      <span class="material-symbols-outlined !text-[22px]" [style.color]="g.color">{{ g.icon }}</span>
      {{ g.ar }}
    </span>
  </div>
}
