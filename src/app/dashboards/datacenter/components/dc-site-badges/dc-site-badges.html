<header class="mb-3"><h2 class="m-0 my-3 text-[20px] leading-2 font-semibold text-slate-600">حالة المواقع</h2></header>
<ul class="m-0 grid min-h-0 flex-1 list-none grid-cols-[repeat(2,minmax(0,1fr))] gap-3 p-0">
  @for (b of badges; track b.name) {
    <li class="flex flex-col items-center justify-center gap-2 rounded-lg bg-hover px-3 py-3 text-center">
      <span class="size-3 rounded-full" [style.background]="b.color"></span>
      <span class="text-[17px] font-bold text-ink">{{ b.name }}</span>
      <span class="text-[18px] font-bold" [style.color]="b.color">{{ b.status }}</span>
    </li>
  }
</ul>
