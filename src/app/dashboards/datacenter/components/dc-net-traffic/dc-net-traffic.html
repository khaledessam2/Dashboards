<header class="mb-3"><h2 class="m-0 my-3 text-[20px] leading-2 font-semibold text-slate-600">أعلى حركة على الشبكة</h2></header>
<ul class="m-0 flex min-h-0 flex-1 list-none flex-col justify-between gap-2 p-0">
  @for (r of rows(); track r.id) {
    <li class="flex flex-col gap-1.5 rounded-md px-1 py-0.5 transition-colors hover:bg-slate-50/80">
      <div class="flex items-center justify-between gap-3">
        <span class="truncate text-[16px] font-medium text-slate-800">{{ r.name }}</span>
        <span class="num shrink-0 text-[15px] font-semibold [direction:ltr]" [style.color]="r.color">{{ r.value.toFixed(0) }} Mbit/s</span>
      </div>
      <div class="h-2.5 overflow-hidden rounded bg-[#f1f5f9]">
        <div class="h-full rounded opacity-80 transition-all duration-700" [style.width.%]="r.width" [style.background]="r.color"></div>
      </div>
    </li>
  }
</ul>
