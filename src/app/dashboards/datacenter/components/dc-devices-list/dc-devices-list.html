<header class="mb-3 flex flex-wrap items-center justify-between gap-2">
  <div class="flex items-center gap-2">
    <h2 class="m-0 my-3 text-[20px] leading-2 font-semibold text-slate-600">الأجهزة</h2>
    <span class="num rounded-full bg-slate-100 px-2 py-0.5 text-[12px] font-medium text-slate-600">{{ filtered().length }}</span>
  </div>
  <div class="inline-flex gap-0.5 rounded-lg bg-slate-100 p-0.5" role="tablist">
    @for (t of tabs; track t.key) {
      <button
        type="button" role="tab" [attr.aria-selected]="filter() === t.key" (click)="filter.set(t.key)"
        class="cursor-pointer rounded-md border-0 px-3 py-2 text-[14px] font-medium transition-colors"
        [class]="filter() === t.key ? 'bg-white text-slate-900 shadow-[0_0_0_1px_#e2e8f0]' : 'bg-transparent text-slate-500 hover:text-slate-800'"
      >{{ t.ar }}</button>
    }
  </div>
</header>
<ul class="scroll-slim m-0 grid min-h-0 flex-1 list-none grid-cols-[repeat(2,minmax(0,1fr))] content-start gap-x-3 gap-y-0.5 overflow-y-auto p-0 pe-1 max-[640px]:grid-cols-[minmax(0,1fr)]">
  @for (d of filtered(); track d.id) {
    <li class="flex items-center gap-3 rounded-lg px-2 py-2 transition-colors hover:bg-slate-50/80">
      <i
        class="size-2.5 shrink-0 rounded-full"
        [class.dc-pulse]="d.status === 'down'"
        [style.background]="meta[d.status].color" [title]="meta[d.status].ar"
      ></i>
      <div class="flex min-w-0 flex-1 flex-col gap-0.5">
        <span class="truncate text-[16px] font-bold text-slate-800">{{ d.name }}</span>
        <span class="truncate text-[15px] text-slate-500">{{ d.group }}</span>
      </div>
      <span class="mono shrink-0 rounded-md border border-slate-200 bg-slate-50 px-2 py-0.5 font-mono text-[15px] text-slate-600 [direction:ltr]">{{ d.ip }}</span>
    </li>
  } @empty {
    <li class="col-span-full py-6 text-center text-[15px] text-slate-500">لا توجد أجهزة</li>
  }
</ul>
