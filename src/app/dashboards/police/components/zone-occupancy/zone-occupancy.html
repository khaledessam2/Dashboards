<header class="mb-4 flex items-center justify-between gap-3">
  <h2 class="m-0 flex items-center gap-2 text-[18px] leading-6 font-bold text-ink"><span class="material-symbols-outlined !text-[20px] text-[#059669]">equalizer</span>نسبة الإشغال والكثافة حسب المنطقة</h2>
  <span class="text-[14px] font-semibold text-[#334155]">مرتب بالأكثر خطورة</span>
</header>
<ul class="m-0 flex min-h-0 flex-1 list-none flex-col p-0">
  @for (z of occRows(); track z.name) {
    <li class="flex flex-1 flex-col justify-center gap-2 border-t border-[#e6ebf2] py-3 first:justify-start first:border-t-0 first:pt-0 last:justify-end last:pb-0">
      <div class="flex items-baseline justify-between gap-3">
        <b class="text-[15px] leading-6 text-ink">{{ z.name }}</b>
        <span class="num flex shrink-0 items-baseline gap-2"><b class="text-[20px] leading-6 text-ink">{{ z.occ }}%</b><span class="text-[14px] font-semibold text-[#334155]">{{ z.density.toFixed(1) }} ش/م²</span></span>
      </div>
      <div class="h-2 overflow-hidden rounded-full bg-[#e6ebf2]"><div class="h-full rounded-full transition-[width] duration-700" [style.width.%]="z.occ" [style.background]="hex[z.level]"></div></div>
      <div class="num flex items-center justify-between gap-3 text-[14px] font-semibold text-[#334155]">
        <span class="flex items-center gap-2 text-ink"><i class="size-2.5 shrink-0 rounded-full" [style.background]="hex[z.level]"></i>{{ z.status }}</span>
        <span>{{ z.dwell ? 'مدة التكدس ' + z.dwell + ' دقيقة' : '' }}</span>
      </div>
    </li>
  }
</ul>
