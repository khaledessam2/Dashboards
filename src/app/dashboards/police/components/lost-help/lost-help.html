<header class="mb-4 flex items-center justify-between gap-3">
  <h2 class="m-0 flex items-center gap-2 text-[18px] leading-6 font-bold text-ink"><span class="material-symbols-outlined !text-[20px] text-[#0b5cff]">support_agent</span>المفقودون ونقاط طلب المساعدة (الإنتركوم)</h2>
</header>
<div class="grid flex-1 grid-cols-2 divide-x divide-x-reverse divide-[#e6ebf2] rounded-lg border border-[#e6ebf2]">
  <div [flashOnChange]="store.missing.lostOpen" class="flex flex-col items-center justify-center gap-1.5 px-3 py-6 text-center">
    <span class="text-[15px] font-semibold text-[#334155]">بلاغات التائهين المفتوحة</span>
    <b class="num rounded-xl bg-[#f1f5f9] px-7 py-1.5 text-[40px] leading-[48px] text-ink">{{ store.missing.lostOpen }}</b>
    <span class="num text-[14px] font-semibold text-[#334155]">تم حل {{ store.missing.notResolvedToday }} اليوم</span>
  </div>
  <div class="flex flex-col items-center justify-center gap-1.5 px-3 py-6 text-center">
    <span class="text-[15px] font-semibold text-[#334155]">طلبات لم يُرد عليها</span>
    <b class="num rounded-xl bg-[#f1f5f9] px-7 py-1.5 text-[40px] leading-[48px] text-ink">{{ store.missing.helpUnanswered }}</b>
    <span class="num flex items-center gap-2 text-[14px] font-semibold text-[#334155]"><i class="size-2.5 rounded-full bg-[#e11d48]"></i>انتظار {{ store.missing.helpWaitSec }} ثانية</span>
  </div>
</div>
