<header class="mb-4">
  <h2 class="m-0 text-[18px] leading-6 font-bold text-ink">أعلى الكاميرات رصداً للأحداث</h2>
</header>
<ul class="m-0 flex min-h-0 flex-1 list-none flex-col justify-between gap-3 p-0">
  @for (r of rows(); track r.name) {
    <li class="flex flex-col gap-1.5">
      <div class="flex items-baseline justify-between gap-2 text-[14px]">
        <span class="mono truncate font-bold text-ink [direction:ltr]">{{ r.name }} <span class="font-medium text-ink-2" dir="rtl">({{ r.place }})</span></span>
        <b class="num shrink-0" [style.color]="r.color">{{ r.count }} حدث</b>
      </div>
      <div class="h-2 overflow-hidden rounded-full bg-[#eef1f6]">
        <div class="h-full rounded-full" [style.width.%]="r.width" [style.background]="r.color"></div>
      </div>
    </li>
  }
</ul>
