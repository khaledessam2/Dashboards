
<header class="mb-3 flex flex-wrap items-center justify-between gap-x-3 gap-y-1">
    <h2 class="m-0 text-[20px] leading-6 font-bold text-ink">
      الأحداث المباشرة
    </h2>
    @if (lastAge(); as age) {
      <span id="last-event-age" class="text-[15px] text-ink-2">آخر حدث منذ <span class="mono">{{ age }}</span></span>
    }
</header>

<ul class="@container m-0 flex min-h-0 flex-1 list-none flex-col gap-1.5 overflow-y-auto p-0 pe-1">
  @for (item of items(); track item.id) {
    <li class="flex flex-wrap items-center gap-x-3 gap-y-1 border-b border-line px-2 py-3 transition-colors hover:bg-hover"
      [class.event-blink]="item.fresh && item.severity !== 'critical'"
      [class.event-blink-critical]="item.fresh && item.severity === 'critical'"
    >
      <span class="flex h-9 w-9 shrink-0 items-center justify-center rounded-lg"
        [class.bg-sev-red/10]="item.severity === 'critical'"
        [class.text-sev-red]="item.severity === 'critical'"
        [class.bg-sev-amber/10]="item.severity === 'warning'"
        [class.text-sev-amber]="item.severity === 'warning'"
        aria-hidden="true">
        <span class="material-symbols-outlined text-[20px]">
          {{ item.icon }}
        </span>
      </span>

      <div class="flex min-w-0 flex-1 flex-col gap-1">
        <span class="truncate text-[18px] font-medium text-ink">
          {{ item.ar }}
        </span>

        <span class="flex items-center gap-1 text-[15px] whitespace-nowrap text-ink-2">
          <span class="material-symbols-outlined !text-[14px]">
            videocam
          </span>
          {{ item.camera }}
        </span>
      </div>

      <div class="flex shrink-0 flex-col items-end gap-1 @max-[360px]:w-full @max-[360px]:flex-row-reverse @max-[360px]:items-center @max-[360px]:justify-between">
        <span class="mono text-[18px] text-ink-2 [direction:ltr]">
          {{ item.time }}
        </span>

        <span class="text-[16px] font-bold"
          [class.text-sev-red]="item.severity === 'critical'"
          [class.text-sev-amber]="item.severity === 'warning'">
          {{ item.severity === 'critical' ? 'حرج' : 'تنبيه' }}
        </span>
      </div>
    </li>
  } @empty {
    <li class="flex flex-1 items-center justify-center text-[15px] text-ink-2">لا توجد أحداث بعد</li>
  }
</ul>
