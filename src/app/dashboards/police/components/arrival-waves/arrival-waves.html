<header class="mb-1 flex items-center justify-between gap-3">
  <h2 class="m-0 flex items-center gap-2 text-[18px] leading-6 font-bold text-ink"><span class="material-symbols-outlined !text-[20px] text-[#059669]">train</span>موجات الوصول القادمة للمدينة (4 ساعات)</h2>
  <span class="num flex shrink-0 items-center gap-2 text-[15px] font-semibold text-ink"><i class="size-2.5 rounded-full bg-[#e11d48]"></i>{{ store.waves().peak }} ذروة</span>
</header>
<p class="m-0 mb-2 text-[15px] font-medium text-[#334155]">مطار الأمير محمد بن عبدالعزيز + قطار الحرمين (المتوقع)</p>
<div class="relative min-h-[200px] flex-1"><app-hc-chart class="absolute inset-0" [options]="waveOptions()" [height]="0" /></div>
<div class="mt-3 flex flex-wrap justify-between gap-2 border-t border-[#e6ebf2] pt-3 text-[14px] font-semibold text-[#334155]">
  <span class="flex items-center gap-2"><i class="size-2.5 rounded-sm bg-[#d97706]"></i>محطة قطار الحرمين (منتظم)</span>
  <span class="flex items-center gap-2"><i class="size-2.5 rounded-sm bg-[#059669]"></i>مطار (MED) المتوقع</span>
</div>
