<header class="mb-3 flex items-center justify-between">
  <h2 class="m-0 text-[20px] leading-6 font-bold text-ink">الأحداث الأمنية بالساعة</h2>
  @if (peak(); as p) {
    <span id="peak-hour-val" class="inline-flex items-center gap-2 rounded-full bg-sev-red/10 px-3 py-1 text-[15px] font-bold text-sev-red">
      ساعة الذروة <span class="num [direction:ltr]">{{ p.label }}</span>
      <span class="num">({{ p.count }})</span>
    </span>
  }
</header>
<div #chart class="min-h-0 flex-1 [direction:ltr]"></div>
