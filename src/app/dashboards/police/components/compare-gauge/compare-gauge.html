<header class="mb-2">
  <h2 class="m-0 text-[18px] leading-6 font-bold text-ink">مقارنة الأحداث بالفترة السابقة</h2>
</header>
<div class="flex flex-1 items-center justify-center py-2">
  <div class="relative w-full max-w-[300px]">
    <svg viewBox="0 0 240 124" class="block w-full [direction:ltr]" aria-hidden="true">
      <path d="M20 118 A100 100 0 0 1 220 118" fill="none" stroke="#eef1f6" stroke-width="16" stroke-linecap="round" />
      <path d="M20 118 A100 100 0 0 1 220 118" fill="none" [attr.stroke]="color()" stroke-width="16" stroke-linecap="round" [attr.stroke-dasharray]="dash()" />
    </svg>
    <div class="absolute inset-x-0 bottom-1 flex flex-col items-center gap-0.5">
      <b class="num text-[38px] leading-10" dir="ltr" [style.color]="color()">{{ text() }}</b>
      <span class="text-[14px] text-ink-2">{{ label() }}</span>
    </div>
  </div>
</div>
<footer class="mt-3 grid grid-cols-2 divide-x divide-x-reverse divide-[#eef1f6] border-t border-[#eef1f6] pt-3 text-center">
  <div class="flex flex-col items-center gap-0.5"><small class="text-[13px] text-ink-3">الفترة السابقة</small><b class="num text-[24px] leading-8 text-ink-2">{{ previous() }}</b></div>
  <div class="flex flex-col items-center gap-0.5"><small class="text-[13px] text-ink-3">الفترة الحالية</small><b class="num text-[24px] leading-8 text-[#0b5cff]">{{ current() }}</b></div>
</footer>
