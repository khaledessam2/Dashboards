<header class="flex items-start justify-between gap-3">
  <h2 class="m-0 flex items-center gap-2 text-[18px] leading-6 font-bold text-ink">
    <span class="material-symbols-outlined text-brand !text-[22px]">speed</span>
    {{ title() }}
  </h2>
  <div class="flex shrink-0 flex-col items-start gap-0.5 text-(color:--level)">
    <span class="flex items-center gap-0.5 text-lg leading-6 font-bold">
      <span class="material-symbols-outlined !text-[22px] !leading-5">{{ pct() >= 0 ? 'arrow_drop_up' : 'arrow_drop_down' }}</span>
      <span class="num [direction:ltr]">{{ pctText() }}</span>
    </span>
    <span class="text-xs leading-4 text-ink-3">مقارنة ب{{ previousLabel() }}</span>
  </div>
</header>

<div class="flex min-h-0 flex-1 flex-col items-center justify-center gap-1">
  <div #chart class="h-[190px] w-full max-w-[420px] [direction:ltr]"></div>
  <div class="flex flex-col items-center gap-0.5">
    <span class="num text-[34px] leading-10 font-bold tracking-[-0.02em] text-(color:--level) [direction:ltr]">{{ pctText() }}</span>
    <span class="text-sm leading-5 font-medium text-(color:--level)">{{ level().label }}</span>
  </div>
</div>

<div class="mt-3 grid grid-cols-2 gap-3">
  <div class="flex flex-col items-center justify-center rounded-lg bg-sky-500/10 px-3 py-3 text-center">
    <span class="text-sm leading-5 font-medium text-ink-2">{{ currentLabel() }}</span>
    <span class="num text-2xl leading-8 font-bold text-ink">{{ current() | number }}</span>
  </div>
  <div class="flex flex-col items-center justify-center rounded-lg bg-slate-500/10 px-3 py-3 text-center">
    <span class="text-sm leading-5 font-medium text-ink-2">{{ previousLabel() }}</span>
    <span class="num text-2xl leading-8 font-bold text-ink">{{ previous() | number }}</span>
  </div>
</div>
