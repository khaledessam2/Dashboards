<header class="mb-4 flex items-center justify-between gap-3">
  <h2 class="m-0 text-[20px] leading-6 font-bold text-ink">مؤشرات أداء البنية التقنية للنظام</h2>
  <i class="size-2.5 rounded-full bg-[#10b981]"></i>
</header>
<div class="grid flex-1 grid-cols-6 gap-3">
  @for (t of tiles(); track t.label; let i = $index) {
    <div class="flex flex-col justify-center gap-1.5 rounded-xl bg-[#f6f8fb] px-4 py-4 max-[560px]:col-span-3" [class]="i < 3 ? 'col-span-2' : 'col-span-3'">
      <span class="text-[15px] font-medium text-ink-2">{{ t.label }}</span>
      <span class="num flex items-baseline justify-end gap-1.5 text-[32px] leading-9 font-bold [direction:ltr]" [style.color]="t.color">
        {{ t.value }}<small class="text-[15px] font-semibold text-ink-3">{{ t.unit }}</small>
      </span>
      @if (t.sub) {
        <span class="text-[13px] text-ink-3">{{ t.sub }}</span>
      }
    </div>
  }
</div>
<p class="m-0 mt-4 border-t border-[#eef1f6] pt-3 text-center text-[14px] text-ink-2">جميع وحدات معالجة الحافة (Edge AI Nodes) تعمل بكفاءة مستقرة {{ uptime() }}%</p>
