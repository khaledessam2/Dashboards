<header class="mb-2">
  <h2 class="m-0 text-[18px] leading-6 font-bold text-ink">الأحداث حسب الكاميرا (الاتجاه الزمني)</h2>
</header>
<div class="flex flex-wrap gap-2">
  @for (l of legend(); track l.key) {
    <button
      type="button"
      class="inline-flex cursor-pointer items-center gap-2 rounded-lg border border-[#e6ebf2] bg-white px-2.5 py-1 text-[13px] font-semibold text-ink transition hover:bg-hover"
      [class.opacity-45]="hidden().has(l.key)"
      [class.line-through]="hidden().has(l.key)"
      [attr.aria-pressed]="!hidden().has(l.key)"
      (click)="toggle(l.key)"
      (mouseenter)="hovered.set(l.key)"
      (mouseleave)="hovered.set(null)"
      (focus)="hovered.set(l.key)"
      (blur)="hovered.set(null)"
    >
      <i class="size-2.5 rounded-full" [style.background]="l.color"></i>
      <span class="mono [direction:ltr]">{{ l.name }}</span>
      <span class="num rounded-full bg-[#f1f5f9] px-1.5 text-[11px] text-ink-2">{{ l.total }}</span>
    </button>
  }
</div>
<app-hc-chart class="min-h-0 flex-1" [options]="options()" [height]="0" />
