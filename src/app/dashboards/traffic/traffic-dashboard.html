<header class="flex items-center justify-between gap-4 pt-3 pb-2">
  <h1 class="m-0 text-2xl leading-8 font-bold text-ink max-[900px]:text-[17px] max-[900px]:leading-6">نظام الرصد الذكي - إدارة المرور</h1>
  <app-clock id="clock" />
</header>

<section class="grid grid-cols-[minmax(0,1.55fr)_minmax(0,1fr)] gap-x-4 gap-y-6 max-[1400px]:grid-cols-[minmax(0,1fr)] max-[480px]:gap-3">
  <div class="grid grid-cols-[repeat(3,minmax(0,1fr))] grid-rows-[repeat(2,minmax(0,1fr))] gap-4 max-[900px]:grid-cols-[repeat(2,minmax(0,1fr))] max-[900px]:grid-rows-none max-[900px]:gap-3 max-[480px]:grid-cols-[minmax(0,1fr)]">
    @for (card of kpiCards(); track card.id) {
      <app-kpi-card [def]="card" />
    }
  </div>
  <app-flow-gauge />
</section>

<section class="grid h-90 grid-cols-[minmax(0,1.55fr)_minmax(0,1fr)] gap-4 max-[1400px]:h-auto max-[1400px]:grid-cols-[minmax(0,1fr)] max-[1400px]:*:h-90 max-[900px]:*:h-80 max-[480px]:gap-3 max-[480px]:*:h-75">
  <app-hourly-chart />
  <app-top-zones />
</section>

<section class="grid h-105 grid-cols-[minmax(0,1.55fr)_minmax(0,1fr)] gap-4 max-[1400px]:h-auto max-[1400px]:grid-cols-[minmax(0,1fr)] max-[1400px]:*:h-96 max-[480px]:gap-3 max-[480px]:*:h-80">
  <app-cam-map />
  <app-live-events />
</section>

<app-cam-ranking class="h-80 max-[640px]:h-auto" />
