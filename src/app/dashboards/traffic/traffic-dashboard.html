<header class="flex items-center justify-between gap-4 pt-3 pb-2">
  <h1 class="m-0 min-w-0 text-2xl leading-8 font-bold text-ink max-[900px]:text-[17px] max-[900px]:leading-6">نظام الرصد الذكي - إدارة المرور</h1>
  <div class="flex shrink-0 items-center">
    <app-last-updated [at]="lastUpdate()" />
  </div>
</header>

<section class="grid grid-cols-[repeat(3,minmax(0,1fr))] items-stretch gap-4 max-[1500px]:grid-cols-[minmax(0,1fr)] max-[480px]:gap-3">
  <!-- Right column: KPIs + vehicle distribution -->
  <div class="flex min-w-0 flex-col gap-4 max-[480px]:gap-3">
    <div class="grid grid-cols-[repeat(2,minmax(0,1fr))] auto-rows-fr gap-4 max-[900px]:gap-3 max-[480px]:grid-cols-[minmax(0,1fr)]">
      @for (card of kpiCards(); track card.id) {
        <app-kpi-card [def]="card" />
      }
    </div>
    <app-vehicle-mix />
  </div>

  <!-- Middle column: flow gauge + top zones -->
  <div class="flex min-w-0 flex-col gap-4 max-[480px]:gap-3">
    <app-flow-gauge />
    <app-top-zones class="h-94" />
  </div>

  <!-- Left column: hourly chart, map, live events -->
  <div class="flex min-w-0 flex-col gap-4 max-[480px]:gap-3">
    <app-hourly-chart class="h-60" />
    <app-cam-map class="h-79" />
    <app-live-events class="h-70" />
  </div>
</section>

<app-cam-ranking class="h-80 max-[640px]:h-auto" />
