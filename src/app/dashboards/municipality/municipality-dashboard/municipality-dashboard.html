<div class="flex flex-col gap-4 px-6 pt-4 pb-6 max-[900px]:px-3">
  <app-muni-header [tabs]="tabs" [active]="tab()" (selected)="selectTab($event)" />
  <app-muni-status-strip />

  <app-muni-kpis />

  @switch (tab()) {
    @case ('overview') { <app-muni-overview-view /> }
    @case ('lighting') { <app-muni-lighting-view /> }
    @case ('reports') { <app-muni-reports-view /> }
    @case ('sanitation') { <app-muni-sanitation-view /> }
    @case ('water') { <app-muni-water-view /> }
    @case ('roads') { <app-muni-roads-view /> }
    @case ('video') { <app-muni-video-view /> }
    @case ('environment') { <app-muni-environment-view /> }
  }
</div>

<app-muni-modals />
