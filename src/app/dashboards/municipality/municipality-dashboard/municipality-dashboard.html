<div class="flex flex-col gap-4 px-6 pt-4 pb-6 max-[900px]:px-3">
  <app-muni-header />
  <app-muni-status-strip />

  <!-- Tabs -->
  <nav class="overflow-x-auto rounded-xl bg-surface p-2 shadow-card" aria-label="التبويبات">
    <div class="flex flex-nowrap justify-between gap-1">
      @for (t of tabs; track t.id) {
        <button type="button" (click)="tab.set(t.id)"
          class="flex cursor-pointer items-center gap-1.5 rounded-lg border-0 px-3 py-2.5 text-[14px] font-semibold whitespace-nowrap transition-colors"
          [class]="tab() === t.id ? 'bg-[#0b5cff] text-white' : 'bg-transparent text-[#475569] hover:bg-[#f6f8fb]'">
          <span class="material-symbols-outlined !text-[20px]" [style.color]="tab() === t.id ? '#fff' : t.color">{{ t.icon }}</span>{{ t.ar }}
        </button>
      }
    </div>
  </nav>

  <app-muni-kpis />

  @switch (tab()) {
    @case ('overview') { <app-muni-overview-view /> }
    @case ('lighting') { <app-muni-lighting-view /> }
    @case ('reports') { <app-muni-reports-view /> }
    @case ('sanitation') { <app-muni-sanitation-view /> }
    @case ('water') { <app-muni-water-view /> }
    @case ('roads') { <app-muni-roads-view /> }
    @case ('video') { <app-muni-video-view /> }
    @case ('environment') { <app-muni-environment-view /> }
  }
</div>

<app-muni-modals />
