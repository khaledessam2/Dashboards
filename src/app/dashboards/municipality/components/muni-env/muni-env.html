<h2 class="m-0 mb-3 text-[18px] leading-6 font-bold text-ink">الظروف البيئية وجودة الهواء</h2>
<div class="grid grid-cols-[repeat(5,minmax(0,1fr))] gap-3 max-[900px]:grid-cols-[repeat(3,minmax(0,1fr))] max-[480px]:grid-cols-[repeat(2,minmax(0,1fr))]">
  @for (e of items(); track e.id) {
    <div class="flex flex-col items-center gap-1 rounded-lg bg-track px-1 py-3 text-center" [id]="e.id">
      <span class="text-[13px] font-medium text-ink-2">{{ e.ar }}</span>
      <b class="num text-[18px] text-ink [direction:ltr]">{{ e.value }}</b>
      @if (e.tag; as tag) {
        <span class="rounded px-1.5 text-[11px] font-bold" [style.background]="tag.color + '1f'" [style.color]="tag.color">{{ tag.ar }}</span>
      }
    </div>
  }
</div>
