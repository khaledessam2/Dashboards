@for (t of tiles(); track t.id) {
  <article class="card flex flex-col gap-1.5 !p-4 last:col-span-2" [id]="t.id" [flashOnChange]="t.value + t.sub">
    <div class="flex items-center gap-2">
      <span class="flex size-9 shrink-0 items-center justify-center rounded-lg" [style.background]="t.color + '1f'" [style.color]="t.color">
        <span class="material-symbols-outlined !text-[20px]">{{ t.icon }}</span>
      </span>
      <span class="text-[14px] leading-5 font-semibold text-ink-2">{{ t.ar }}</span>
    </div>
    <b class="num text-[28px] leading-8" [style.color]="t.color">{{ t.value }}</b>
    <span class="text-[12px] leading-4 text-ink-3">{{ t.sub }}</span>
  </article>
}
