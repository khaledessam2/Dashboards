@for (ind of indicators(); track ind.id) {
  <section class="card" [id]="ind.id">
    <header class="mb-3 flex items-start justify-between gap-3">
      <div class="min-w-0">
        <h2 class="m-0 text-xl leading-7 font-bold text-ink">{{ ind.ar }}</h2>
        <p class="m-0 mt-0.5 text-[15px] leading-5 text-ink-3">{{ ind.hint }}</p>
      </div>
      <div class="flex shrink-0 flex-col items-center">
        <span class="num text-[32px] leading-10 font-bold" [style.color]="ind.color">{{ ind.total }}</span>
        <span class="text-[14px] text-ink-3">الإجمالي</span>
      </div>
    </header>
    <ul class="m-0 flex list-none flex-col gap-2.5 p-0">
      @for (r of ind.rows; track r.ar) {
        <li class="flex items-center gap-3">
          <span class="w-[150px] shrink-0 truncate text-[16px] text-ink-2 max-[480px]:w-[115px]" [attr.title]="r.ar">{{ r.ar }}</span>
          <span class="h-2.5 min-w-0 flex-1 overflow-hidden rounded-full bg-track">
            <span class="block h-full rounded-full" [style.width.%]="r.pct" [style.background]="ind.color"></span>
          </span>
          <span class="num w-8 shrink-0 text-end text-[16px] font-semibold text-ink">{{ r.value }}</span>
        </li>
      }
    </ul>
  </section>
}
