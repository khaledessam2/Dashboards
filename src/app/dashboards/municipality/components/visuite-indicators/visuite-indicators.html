@for (ind of indicators(); track ind.id) {
  <section class="card @container" [id]="ind.id">
    <header class="mb-3 flex items-start justify-between gap-3 @max-[400px]:flex-col-reverse @max-[400px]:items-start @max-[400px]:gap-1">
      <div class="min-w-0">
        <h2 class="m-0 text-xl leading-7 font-bold text-ink">{{ ind.ar }}</h2>
        <p class="m-0 mt-0.5 text-[15px] leading-5 text-ink-3">{{ ind.hint }}</p>
      </div>
      <div class="flex shrink-0 flex-col items-center @max-[400px]:flex-row @max-[400px]:items-baseline @max-[400px]:gap-2">
        <span class="num text-[32px] leading-10 font-bold" [style.color]="ind.color">{{ ind.total }}</span>
        <span class="text-[14px] text-ink-3">الإجمالي</span>
      </div>
    </header>
    <ul class="m-0 flex list-none flex-col gap-2.5 p-0">
      @for (r of ind.rows; track r.ar) {
        <li class="flex items-center gap-3 @max-[400px]:grid @max-[400px]:grid-cols-[1fr_auto] @max-[400px]:gap-x-2 @max-[400px]:gap-y-1">
          <span class="w-[150px] shrink-0 truncate text-[16px] text-ink-2 @max-[400px]:w-auto @max-[400px]:min-w-0" [attr.title]="r.ar">{{ r.ar }}</span>
          <span class="h-2.5 min-w-0 flex-1 overflow-hidden rounded-full bg-track @max-[400px]:order-3 @max-[400px]:col-span-2">
            <span class="block h-full rounded-full" [style.width.%]="r.pct" [style.background]="ind.color"></span>
          </span>
          <span class="num w-8 shrink-0 text-end @max-[400px]:order-2 text-[16px] font-semibold text-ink">{{ r.value }}</span>
        </li>
      }
    </ul>
  </section>
}
