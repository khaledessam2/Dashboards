<div class="flex flex-col gap-4 px-6 pt-4 pb-6 max-[900px]:px-3">
  <app-exec-header />
  <app-exec-kpis />

  <section class="grid grid-cols-[minmax(0,7fr)_minmax(0,5fr)] items-stretch gap-4 max-[1300px]:grid-cols-[minmax(0,1fr)]">
    <app-exec-map />
    <app-exec-situations />
  </section>
</div>

<app-exec-drawer />

@if (store.toast(); as msg) {
  <div class="fixed bottom-4 left-4 z-[2100] flex max-w-[460px] items-center gap-2.5 rounded-xl border border-[#a7f3d0] bg-white px-4 py-3 text-[14px] font-bold text-ink shadow-xl" role="status">
    <span class="material-symbols-outlined text-[#10b981]">check_circle</span><span>{{ msg }}</span>
  </div>
}
